name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JavaScript libraries (bundled inside the APK, app works offline)
        run: |
          mkdir -p app/src/main/assets/lib
          cd app/src/main/assets/lib
          get() {
            curl -fsSL --retry 4 --retry-delay 3 "$2" -o "$1" || { echo "FAILED to download $1 from $2"; exit 1; }
            test -s "$1" || { echo "EMPTY file $1"; exit 1; }
          }
          get jszip.min.js        https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js
          get docx-preview.min.js https://cdn.jsdelivr.net/npm/docx-preview@0.3.7/dist/docx-preview.min.js
          get exceljs.min.js      https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js
          get html2canvas.min.js  https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js
          ls -la

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PocketOffice-apk
          path: app/build/outputs/apk/debug/app-debug.apk
